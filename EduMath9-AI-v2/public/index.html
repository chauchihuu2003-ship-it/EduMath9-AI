<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EduMath 9 AI</title><style>
:root{--bg:#f4f7fb;--card:#fff;--text:#132238;--muted:#64748b;--line:#dbe3ee;--primary:#2563eb;--soft:#eaf1ff;--danger:#dc2626;--ok:#16a34a}*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}.app{display:flex;min-height:100vh}.side{width:245px;background:#10243d;color:#dce8f7;padding:22px 15px;position:sticky;top:0;height:100vh}.brand{font-size:21px;font-weight:800;padding:8px 10px 25px}.brand span{color:#60a5fa}.nav button{width:100%;border:0;background:transparent;color:#c8d6e8;text-align:left;padding:12px;border-radius:10px;margin:3px 0;cursor:pointer}.nav button.active,.nav button:hover{background:#1c3b61;color:#fff}.status{margin-top:25px;padding:12px;border:1px solid #31506f;border-radius:10px;font-size:12px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ef4444;margin-right:7px}.dot.ok{background:#22c55e}.main{flex:1;padding:28px;max-width:1500px;margin:auto;width:100%}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;color:var(--primary)}h1{font-size:32px;margin:6px 0}h2{margin:0 0 6px}h3{margin:20px 0 9px}.sub,.hint{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin:22px 0}.grid2{display:grid;grid-template-columns:minmax(360px,500px) 1fr;gap:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:20px;box-shadow:0 2px 10px #10243d0a}.stat b{display:block;font-size:30px}.stat span{color:var(--muted);font-size:13px}.field{margin-bottom:14px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}.field input,.field select,.field textarea{width:100%;border:1px solid #cbd5e1;border-radius:9px;padding:10px 11px;background:#fff;color:var(--text)}textarea{min-height:110px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{border:0;background:var(--primary);color:white;padding:10px 14px;border-radius:9px;font-weight:700;cursor:pointer}.btn.secondary{background:#e8eef7;color:#17324d}.btn.green{background:var(--ok)}.btn.danger{background:#fee2e2;color:#991b1b}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.empty,.loading,.error{padding:28px;border:1px dashed var(--line);border-radius:12px;color:var(--muted)}.error{color:#991b1b;background:#fff1f2;border-color:#fecdd3}.lesson-list{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.lesson,.project,.source{border:1px solid var(--line);border-radius:11px;padding:13px}.lesson strong,.project strong{display:block;margin:4px 0}.tag{font-size:10px;font-weight:800;background:var(--soft);color:var(--primary);padding:4px 7px;border-radius:20px}.activity,.slide{padding:14px;margin:10px 0;border:1px solid var(--line);border-radius:10px;background:#fbfdff}.editor{display:grid;gap:10px}.editor textarea{min-height:70px}.source-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.source-list{display:grid;gap:8px;max-height:330px;overflow:auto}.source small{color:var(--muted)}.top-actions{display:flex;justify-content:space-between;gap:10px;align-items:flex-end}.preview{max-height:75vh;overflow:auto}.check{font-size:12px;padding:9px;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:9px;color:#166534;margin-bottom:12px}@media(max-width:900px){.side{width:75px}.brand{font-size:0}.brand span{font-size:20px}.nav button{font-size:0;text-align:center}.main{padding:18px}.grid,.grid2,.source-grid{grid-template-columns:1fr}.lesson-list{grid-template-columns:1fr}.row{grid-template-columns:1fr}}
</style></head><body><div class="app"><aside class="side"><div class="brand">EduMath <span>9 AI</span></div><div class="nav"><button data-page="home">⌂ &nbsp; Tổng quan</button><button data-page="plan">▣ &nbsp; Kế hoạch bài dạy</button><button data-page="slides">▤ &nbsp; Slide PowerPoint</button><button data-page="library">▦ &nbsp; Kho bài học</button><button data-page="sources">◫ &nbsp; Kho nguồn SGK</button><button data-page="products">◷ &nbsp; Sản phẩm của tôi</button></div><div class="status"><span id="dot" class="dot"></span><span id="statusText">Đang kiểm tra AI...</span></div></aside><main class="main" id="app"></main></div><script>
const S={lessons:[],projects:[],sources:[],page:'home',last:null};const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
async function api(url,opt={}){const r=await fetch(url,opt),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Có lỗi máy chủ');return d}async function init(){try{const [l,p,so,h]=await Promise.all([api('/api/lessons'),api('/api/projects'),api('/api/sources'),api('/api/health')]);S.lessons=l.lessons;S.projects=p.projects;S.sources=so.sources;$('#dot').classList.toggle('ok',h.aiConfigured);$('#statusText').textContent=h.aiConfigured?'AI đã kết nối':'Chưa có API key';render()}catch(e){$('#app').innerHTML='<div class="error">'+esc(e.message)+'</div>'}}
const shell=(t,s)=>`<div class="top-actions"><div><div class="eyebrow">EDUMATH 9 AI · V2</div><h1>${t}</h1><div class="sub">${s}</div></div></div>`;const options=()=>S.lessons.map(x=>`<option value="${x.id}">${esc(x.title)}</option>`).join('');
function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===S.page));const fn={home,plan,slides,library,sources,products}[S.page];$('#app').innerHTML=fn();bind()}
function home(){return shell('Trợ lý AI cho giáo viên Toán 9','Tạo kế hoạch và PowerPoint thật từ dữ liệu bài học + nguồn tài liệu giáo viên cung cấp.')+`<div class="grid"><div class="card stat"><b>${S.lessons.length}</b><span>bài học trong danh mục</span></div><div class="card stat"><b>${S.sources.length}</b><span>nguồn đã nạp</span></div><div class="card stat"><b>${S.projects.length}</b><span>sản phẩm đã lưu</span></div></div><div class="grid2"><div class="card"><h3>Bắt đầu</h3><p class="sub">AI chỉ nên dùng dữ liệu nguồn đã cung cấp để khẳng định chi tiết SGK.</p><div class="toolbar"><button class="btn" data-go="plan">Tạo kế hoạch</button><button class="btn secondary" data-go="slides">Tạo PowerPoint</button></div></div><div class="card"><h3>Quy trình</h3><p>Chọn bài → nạp nguồn → AI tạo → chỉnh sửa → lưu → xuất Word/PPTX.</p><div class="check">API key được giữ ở backend, không đưa vào mã frontend.</div></div></div>`}
function sourcePicker(){return `<div class="field"><label>Nguồn tức thời</label><textarea id="source" placeholder="Dán nội dung bài học hoặc yêu cầu nguồn cụ thể..."></textarea></div><div class="field"><label>Nguồn đã lưu cho bài</label><div id="savedSources" class="source-list"><span class="hint">Chọn bài để xem nguồn liên quan.</span></div></div>`}
function plan(){return shell('Tạo kế hoạch bài dạy','AI tạo cấu trúc có thể chỉnh sửa trước khi xuất Word.')+`<div class="grid2"><div class="card"><div class="field"><label>Bài học</label><select id="lesson">${options()}</select></div><div class="row"><div class="field"><label>Thời lượng</label><input id="duration" type="number" value="45" min="20"></div><div class="field"><label>Phương pháp</label><select id="method"><option>5E</option><option>Dạy học giải quyết vấn đề</option><option>Khám phá - luyện tập - vận dụng</option><option>Hoạt động trải nghiệm</option></select></div></div>${sourcePicker()}<div class="field"><label>Yêu cầu riêng</label><textarea id="request" placeholder="Ví dụ: có hoạt động nhóm, phân hóa 3 mức, gắn thực tế..."></textarea></div><button class="btn" id="genPlan">✦ Tạo bằng AI</button></div><div class="card preview"><div id="result"><div class="empty">Kết quả sẽ xuất hiện ở đây.</div></div></div></div>`}
function slides(){return shell('Tạo slide PowerPoint','AI tạo nội dung slide, m có thể sửa từng slide trước khi xuất .pptx.')+`<div class="grid2"><div class="card"><div class="field"><label>Bài học</label><select id="lesson">${options()}</select></div><div class="row"><div class="field"><label>Số slide</label><input id="count" type="number" min="5" max="30" value="12"></div><div class="field"><label>Phong cách</label><select id="style"><option>Hiện đại, rõ ràng</option><option>Trực quan, nhiều hoạt động</option><option>Tối giản, học thuật</option><option>Thân thiện với học sinh</option></select></div></div>${sourcePicker()}<div class="field"><label>Yêu cầu riêng</label><textarea id="request" placeholder="Ví dụ: có trò chơi, câu hỏi tương tác, đáp án ẩn..."></textarea></div><button class="btn" id="genSlides">✦ Tạo PowerPoint bằng AI</button></div><div class="card preview"><div id="result"><div class="empty">Bộ slide sẽ xuất hiện ở đây.</div></div></div></div>`}
function library(){return shell('Kho bài học','Metadata bài học làm dữ liệu nền. Chi tiết SGK nên được nạp vào Kho nguồn.')+`<div class="card"><div class="lesson-list">${S.lessons.map(x=>`<div class="lesson"><small>${esc(x.chapter||'')} · ${esc(x.term||'')}</small><strong>${esc(x.title)}</strong><div class="hint">${esc((x.keywords||[]).join(', '))}</div></div>`).join('')}</div></div>`}
function sources(){return shell('Kho nguồn SGK','Nạp PDF/DOCX/TXT/MD và gắn nguồn vào một bài để AI ưu tiên nguồn đó.')+`<div class="grid2"><div class="card"><div class="field"><label>Bài gắn nguồn</label><select id="sourceLesson"><option value="">Nguồn chung</option>${options()}</select></div><div class="field"><label>File</label><input id="sourceFile" type="file" accept=".pdf,.docx,.txt,.md"></div><button class="btn" id="uploadSource">Nạp vào kho</button><p class="hint">Tối đa 25 MB. Nội dung được trích xuất và lưu trong data/sources.json.</p></div><div class="card"><div class="source-list">${S.sources.length?S.sources.map(x=>`<div class="source"><b>${esc(x.name)}</b><small>${x.lessonId?esc(S.lessons.find(l=>l.id===x.lessonId)?.title||x.lessonId):'Nguồn chung'} · ${x.chars} ký tự</small><button class="btn danger" data-del-source="${x.id}" style="margin-top:8px">Xóa</button></div>`).join(''):'<div class="empty">Chưa có nguồn.</div>'}</div></div></div>`}
function products(){return shell('Sản phẩm của tôi','Mở lại, chỉnh sửa, lưu và xuất các sản phẩm đã tạo.')+`<div class="card">${S.projects.length?S.projects.map(p=>`<div class="project"><div><span class="tag">${p.type==='plan'?'KẾ HOẠCH':'SLIDE'}</span><strong>${esc(p.name)}</strong><div class="hint">${new Date(p.updatedAt||p.createdAt).toLocaleString('vi-VN')}</div></div><div class="toolbar"><button class="btn secondary" data-view="${p.id}">Mở</button><button class="btn danger" data-delete="${p.id}">Xóa</button></div></div>`).join(''):'<div class="empty">Chưa có sản phẩm.</div>'}</div>`}
function bind(){document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{S.page=b.dataset.page;render()});document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{S.page=b.dataset.go;render()});if($('#lesson')){$('#lesson').onchange=loadSavedSources;loadSavedSources()}if($('#genPlan'))$('#genPlan').onclick=genPlan;if($('#genSlides'))$('#genSlides').onclick=genSlides;if($('#uploadSource'))$('#uploadSource').onclick=uploadSource;document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{if(confirm('Xóa sản phẩm?')){await api('/api/projects/'+b.dataset.delete,{method:'DELETE'});S.projects=(await api('/api/projects')).projects;render()}});document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>openProject(S.projects.find(p=>p.id===b.dataset.view)));document.querySelectorAll('[data-del-source]').forEach(b=>b.onclick=async()=>{await api('/api/sources/'+b.dataset.delSource,{method:'DELETE'});S.sources=(await api('/api/sources')).sources;render()})}
async function loadSavedSources(){if(!$('#savedSources'))return;const arr=(await api('/api/sources?lessonId='+encodeURIComponent($('#lesson').value))).sources;$('#savedSources').innerHTML=arr.length?arr.map(x=>`<div class="source"><b>${esc(x.name)}</b><small>${x.chars} ký tự</small></div>`).join(''):'<span class="hint">Chưa có nguồn lưu cho bài này.</span>'}
async function uploadSource(){try{const f=$('#sourceFile').files[0];if(!f)return alert('Chọn file trước.');const fd=new FormData();fd.append('file',f);fd.append('lessonId',$('#sourceLesson').value);await api('/api/sources',{method:'POST',body:fd});S.sources=(await api('/api/sources')).sources;alert('Đã nạp nguồn vào kho.');render()}catch(e){alert(e.message)}}
const loading=()=>'<div class="loading">AI đang xử lý... Nếu nguồn dài, có thể mất một lúc.</div>';
async function genPlan(){const r=$('#result');r.innerHTML=loading();try{const d=await api('/api/generate-plan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({lessonId:$('#lesson').value,duration:$('#duration').value,method:$('#method').value,request:$('#request').value,source:$('#source').value})});S.last=d.project;S.projects.unshift(d.project);renderPlan(d.project)}catch(e){r.innerHTML='<div class="error">'+esc(e.message)+'</div>'}}
function renderPlan(p){const d=p.data;$('#result').innerHTML=`<div class="editor"><div class="field"><label>Tên kế hoạch</label><input id="edTitle" value="${esc(d.title)}"></div><div class="check">Đây là bản nháp AI. Hãy kiểm tra nội dung chuyên môn trước khi sử dụng trên lớp.</div><h3>Mục tiêu</h3><div id="objectives">${(d.objectives||[]).map((x,i)=>`<textarea data-obj="${i}">${esc(x)}</textarea>`).join('')}</div><h3>Tiến trình</h3>${(d.activities||[]).map((a,i)=>`<div class="activity"><b>${esc(a.phase)} · ${esc(a.time)}</b><textarea data-a="${i}" data-k="teacher" placeholder="Hoạt động GV">${esc(a.teacher)}</textarea><textarea data-a="${i}" data-k="students" placeholder="Hoạt động HS">${esc(a.students)}</textarea><textarea data-a="${i}" data-k="product" placeholder="Sản phẩm">${esc(a.product)}</textarea><textarea data-a="${i}" data-k="assessment" placeholder="Đánh giá">${esc(a.assessment)}</textarea></div>`).join('')}<div class="toolbar"><button class="btn" id="savePlan">Lưu chỉnh sửa</button><button class="btn green" id="exportDocx">Xuất Word</button></div></div>`;$('#savePlan').onclick=()=>savePlan(p);$('#exportDocx').onclick=()=>download('/api/export/docx',p,'ke-hoach-bai-day.docx')}
async function savePlan(p){const d=structuredClone(p.data);d.title=$('#edTitle').value;document.querySelectorAll('[data-obj]').forEach(e=>d.objectives[+e.dataset.obj]=e.value);document.querySelectorAll('[data-a]').forEach(e=>d.activities[+e.dataset.a][e.dataset.k]=e.value);const x=await api('/api/projects/'+p.id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({data:d})});p.data=d;p.name=d.title;alert('Đã lưu.');S.projects=(await api('/api/projects')).projects}
async function genSlides(){const r=$('#result');r.innerHTML=loading();try{const d=await api('/api/generate-slides',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({lessonId:$('#lesson').value,count:$('#count').value,style:$('#style').value,request:$('#request').value,source:$('#source').value})});S.last=d.project;S.projects.unshift(d.project);renderSlides(d.project)}catch(e){r.innerHTML='<div class="error">'+esc(e.message)+'</div>'}}
function renderSlides(p){const d=p.data;$('#result').innerHTML=`<div class="editor"><div class="field"><label>Tiêu đề</label><input id="slideTitle" value="${esc(d.title)}"></div>${(d.slides||[]).map((s,i)=>`<div class="slide"><b>Slide ${i+1}</b><input data-st="${i}" value="${esc(s.title)}" style="margin:8px 0;width:100%;padding:9px;border:1px solid #cbd5e1;border-radius:8px"><textarea data-sb="${i}" placeholder="Mỗi dòng là một bullet">${esc((s.bullets||[]).join('\n'))}</textarea><textarea data-sn="${i}" placeholder="Ghi chú giáo viên">${esc(s.speakerNotes||'')}</textarea></div>`).join('')}<div class="toolbar"><button class="btn" id="saveSlides">Lưu chỉnh sửa</button><button class="btn green" id="exportPptx">Xuất PowerPoint</button></div></div>`;$('#saveSlides').onclick=()=>saveSlides(p);$('#exportPptx').onclick=()=>download('/api/export/pptx',p,'bai-giang.pptx')}
async function saveSlides(p){const d=structuredClone(p.data);d.title=$('#slideTitle').value;document.querySelectorAll('[data-st]').forEach(e=>d.slides[+e.dataset.st].title=e.value);document.querySelectorAll('[data-sb]').forEach(e=>d.slides[+e.dataset.sb].bullets=e.value.split('\n').map(x=>x.trim()).filter(Boolean));document.querySelectorAll('[data-sn]').forEach(e=>d.slides[+e.dataset.sn].speakerNotes=e.value);await api('/api/projects/'+p.id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({data:d})});S.projects=(await api('/api/projects')).projects;alert('Đã lưu.');}
async function download(url,p,name){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({project:p})});if(!r.ok){const e=await r.json();return alert(e.error||'Xuất file thất bại')}const b=await r.blob(),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function openProject(p){S.page=p.type==='plan'?'plan':'slides';render();setTimeout(()=>p.type==='plan'?renderPlan(p):renderSlides(p),0)}
init();
</script></body></html>
