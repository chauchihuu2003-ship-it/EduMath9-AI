<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EduMath 9 AI</title>
<style>
:root{--bg:#f3f6fa;--card:#fff;--text:#172033;--muted:#64748b;--line:#dbe3ee;--primary:#2563eb;--primary-dark:#1d4ed8;--soft:#eaf1ff;--ok:#16a34a;--danger:#dc2626;--nav:#10243d;--nav2:#1c3b61}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}.app{display:flex;min-height:100vh}.side{width:245px;background:var(--nav);color:#dce8f7;padding:22px 15px;position:sticky;top:0;height:100vh;flex:0 0 245px}.brand{font-size:21px;font-weight:800;padding:8px 10px 25px}.brand span{color:#60a5fa}.nav button{width:100%;border:0;background:transparent;color:#c8d6e8;text-align:left;padding:12px;border-radius:10px;margin:3px 0;cursor:pointer}.nav button.active,.nav button:hover{background:var(--nav2);color:#fff}.status{margin-top:25px;padding:12px;border:1px solid #31506f;border-radius:10px;font-size:12px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ef4444;margin-right:7px}.dot.ok{background:#22c55e}.main{flex:1;padding:28px;max-width:1550px;margin:auto;width:100%}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;color:var(--primary)}h1{font-size:30px;margin:6px 0}h2{margin:0 0 6px}h3{margin:20px 0 9px}.sub,.hint{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin:22px 0}.grid2{display:grid;grid-template-columns:minmax(360px,500px) minmax(600px,1fr);gap:18px;align-items:start}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:20px;box-shadow:0 2px 10px #10243d0a}.stat b{display:block;font-size:30px}.stat span{color:var(--muted);font-size:13px}.field{margin-bottom:14px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}.field input,.field select,.field textarea{width:100%;border:1px solid #cbd5e1;border-radius:9px;padding:10px 11px;background:#fff;color:var(--text)}.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px #2563eb18}textarea{min-height:110px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{border:0;background:var(--primary);color:#fff;padding:10px 14px;border-radius:9px;font-weight:700;cursor:pointer}.btn:hover{background:var(--primary-dark)}.btn.secondary{background:#e8eef7;color:#17324d}.btn.green{background:var(--ok)}.btn.danger{background:#fee2e2;color:#991b1b}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.empty,.loading,.error{padding:28px;border:1px dashed var(--line);border-radius:12px;color:var(--muted)}.error{color:#991b1b;background:#fff1f2;border-color:#fecdd3}.lesson-list{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.lesson,.project,.source{border:1px solid var(--line);border-radius:11px;padding:13px}.lesson strong,.project strong{display:block;margin:4px 0}.tag{font-size:10px;font-weight:800;background:var(--soft);color:var(--primary);padding:4px 7px;border-radius:20px}.activity,.slide{padding:14px;margin:10px 0;border:1px solid var(--line);border-radius:10px;background:#fbfdff}.editor{display:grid;gap:10px}.editor textarea{min-height:70px}.source-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.source-list{display:grid;gap:8px;max-height:330px;overflow:auto}.source small{display:block;color:var(--muted);margin-top:4px}.top-actions{display:flex;justify-content:space-between;gap:10px;align-items:flex-end;margin-bottom:18px}.check{font-size:12px;padding:9px;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:9px;color:#166534;margin-bottom:12px}.plan-shell{display:grid;grid-template-columns:minmax(360px,500px) minmax(620px,1fr);gap:18px;align-items:start}.plan-form{position:sticky;top:20px}.preview-card{padding:0;background:#e7ebf1;overflow:hidden}.preview-toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;background:#fff;border-bottom:1px solid var(--line)}.preview-toolbar .hint{font-size:12px}.preview-scroll{height:calc(100vh - 180px);min-height:700px;overflow:auto;padding:32px}.a4-paper{width:210mm;min-height:297mm;margin:0 auto;background:#fff;color:#111;padding:20mm 18mm 20mm 22mm;box-shadow:0 5px 25px #0f172a24;font-family:"Times New Roman",Times,serif;font-size:13pt;line-height:1.5}.a4-header{text-align:center;margin-bottom:18px}.a4-title{font-size:17pt;font-weight:700;line-height:1.3;margin:0 0 9px}.a4-meta{font-size:12.5pt;margin-bottom:18px}.a4-section{font-size:13.5pt;font-weight:700;margin:18px 0 7px;text-transform:uppercase}.a4-subsection{font-size:13pt;font-weight:700;margin:10px 0 5px}.a4-list{margin:5px 0 8px;padding-left:28px}.a4-list li{margin:3px 0}.a4-note{font-size:11pt;color:#555;font-style:italic;border-top:1px solid #999;padding-top:10px;margin-top:24px}.activity-table{width:100%;border-collapse:collapse;table-layout:fixed;margin:10px 0 18px;font-size:11.2pt}.activity-table th,.activity-table td{border:1px solid #222;padding:6px 7px;vertical-align:top;word-break:break-word}.activity-table th{text-align:center;font-weight:700;background:#f2f2f2}.activity-table th:nth-child(1){width:13%}.activity-table th:nth-child(2){width:9%}.activity-table th:nth-child(3){width:25%}.activity-table th:nth-child(4){width:25%}.activity-table th:nth-child(5){width:28%}.edit-mode .edit-field{display:block;width:100%;border:1px dashed #93c5fd;background:#eff6ff;border-radius:4px;padding:3px;font:inherit;color:inherit;line-height:1.45;resize:vertical}.edit-mode textarea.edit-field{min-height:54px}.edit-mode .a4-title.edit-field{font-size:17pt;font-weight:700;text-align:center}.edit-mode .edit-list{list-style:none;padding-left:0}.edit-mode .edit-list li{margin:5px 0}.edit-mode .activity-table textarea{width:100%;min-height:75px;border:1px dashed #93c5fd;background:#eff6ff;font:inherit;resize:vertical}.view-only .edit-field{display:none}.edit-actions{display:none}.edit-mode .view-actions{display:none}.edit-mode .edit-actions{display:flex}.source-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;background:#eff6ff;color:#1d4ed8;border-radius:999px;padding:4px 8px}.slide-preview{background:#0f172a;padding:22px;border-radius:12px}.slide-page{background:#f8fafc;min-height:420px;border-radius:10px;padding:35px;margin-bottom:12px;color:#111827}.slide-page h2{font-size:27px}.slide-page li{font-size:18px;margin:10px 0}.slide-page .notes{margin-top:25px;padding:10px;border-top:1px solid #cbd5e1;color:#64748b;font-size:12px}.modal-backdrop{position:fixed;inset:0;background:#0f172a66;display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px}.modal{width:min(900px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:15px;padding:22px;box-shadow:0 20px 50px #0004}.hidden{display:none!important}@media(max-width:1100px){.side{width:82px;flex-basis:82px}.brand{font-size:0}.brand span{font-size:20px}.nav button{font-size:0;text-align:center}.plan-shell,.grid2{grid-template-columns:1fr}.plan-form{position:static}.preview-scroll{height:auto;min-height:0}.a4-paper{margin:0 auto}.grid{grid-template-columns:1fr}.lesson-list{grid-template-columns:1fr}}@media(max-width:700px){.main{padding:14px}.row{grid-template-columns:1fr}.preview-scroll{padding:12px}.a4-paper{transform-origin:top left}.preview-card{overflow:auto}.top-actions{align-items:flex-start}.grid{margin:14px 0}}
@media print{body{background:#fff}.side,.top-actions,.preview-toolbar,.plan-form{display:none!important}.main{padding:0;max-width:none}.plan-shell{display:block}.preview-card{background:#fff;border:0}.preview-scroll{padding:0;height:auto;overflow:visible}.a4-paper{box-shadow:none;margin:0;width:100%;min-height:auto;padding:0;font-size:13pt}.a4-section{break-after:avoid}.activity-table{break-inside:auto}.activity-table tr{break-inside:avoid}.a4-note{display:none}}
</style>
</head>
<body>
<div class="app">
<aside class="side">
  <div class="brand">EduMath <span>9 AI</span></div>
  <div class="nav">
    <button data-page="home">⌂ &nbsp; Tổng quan</button>
    <button data-page="plan">▣ &nbsp; Kế hoạch bài dạy</button>
    <button data-page="slides">▤ &nbsp; Slide PowerPoint</button>
    <button data-page="library">▦ &nbsp; Kho bài học</button>
    <button data-page="sources">◫ &nbsp; Kho nguồn SGK</button>
    <button data-page="products">◷ &nbsp; Sản phẩm của tôi</button>
  </div>
  <div class="status"><span id="dot" class="dot"></span><span id="statusText">Đang kiểm tra AI...</span></div>
</aside>
<main class="main" id="app"></main>
</div>
<script>
const S={lessons:[],projects:[],sources:[],page:'home',last:null,editing:false};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
async function api(url,opt={}){const r=await fetch(url,opt),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Có lỗi máy chủ');return d}
async function init(){try{const [l,p,so,h]=await Promise.all([api('/api/lessons'),api('/api/projects'),api('/api/sources'),api('/api/health')]);S.lessons=l.lessons;S.projects=p.projects;S.sources=so.sources;$('#dot').classList.toggle('ok',h.aiConfigured);$('#statusText').textContent=h.aiConfigured?`Gemini đã kết nối · ${h.model||''}`:'Chưa có API key';render()}catch(e){$('#app').innerHTML='<div class="error">'+esc(e.message)+'</div>'}}
const shell=(t,s)=>`<div class="top-actions"><div><div class="eyebrow">EDUMATH 9 AI · GEMINI</div><h1>${t}</h1><div class="sub">${s}</div></div></div>`;
const options=()=>S.lessons.map(x=>`<option value="${x.id}">${esc(x.title)}</option>`).join('');
function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===S.page));const fn={home,plan,slides,library,sources,products}[S.page];$('#app').innerHTML=fn();bind()}
function home(){return shell('Trợ lý AI cho giáo viên Toán 9','Tạo kế hoạch và PowerPoint từ dữ liệu bài học + nguồn tài liệu giáo viên cung cấp.')+`<div class="grid"><div class="card stat"><b>${S.lessons.length}</b><span>bài học trong danh mục</span></div><div class="card stat"><b>${S.sources.length}</b><span>nguồn đã nạp</span></div><div class="card stat"><b>${S.projects.length}</b><span>sản phẩm đã lưu</span></div></div><div class="grid2"><div class="card"><h3>Bắt đầu</h3><p class="sub">AI ưu tiên metadata bài học và nguồn giáo viên đã nạp. Hãy rà soát chuyên môn trước khi sử dụng.</p><div class="toolbar"><button class="btn" data-go="plan">Tạo kế hoạch</button><button class="btn secondary" data-go="slides">Tạo PowerPoint</button></div></div><div class="card"><h3>Quy trình</h3><p>Chọn bài → nạp nguồn → AI tạo → xem trước A4 → chỉnh sửa nếu cần → lưu → xuất Word/PPTX.</p><div class="check">API key Gemini chỉ nằm ở backend, không đưa vào frontend.</div></div></div>`}
function sourcePicker(){return `<div class="field"><label>Nguồn tức thời</label><textarea id="source" placeholder="Dán nội dung bài học hoặc yêu cầu nguồn cụ thể..."></textarea></div><div class="field"><label>Nguồn đã lưu cho bài</label><div id="savedSources" class="source-list"><span class="hint">Chọn bài để xem nguồn liên quan.</span></div></div>`}
function plan(){return shell('Tạo kế hoạch bài dạy','Bên trái là cấu hình; bên phải là bản xem trước A4 giống văn bản Word.')+`<div class="plan-shell"><div class="card plan-form"><div class="field"><label>Bài học</label><select id="lesson">${options()}</select></div><div class="row"><div class="field"><label>Thời lượng</label><input id="duration" type="number" value="45" min="20"></div><div class="field"><label>Phương pháp</label><select id="method"><option>5E</option><option>Dạy học giải quyết vấn đề</option><option>Khám phá - luyện tập - vận dụng</option><option>Hoạt động trải nghiệm</option></select></div></div>${sourcePicker()}<div class="field"><label>Yêu cầu riêng</label><textarea id="request" placeholder="Ví dụ: có hoạt động nhóm, phân hóa 3 mức, gắn thực tế..."></textarea></div><button class="btn" id="genPlan">✦ Tạo bằng AI</button></div><div class="card preview-card"><div id="result"><div class="empty">Kết quả sẽ xuất hiện ở đây.</div></div></div></div>`}
function slides(){return shell('Tạo slide PowerPoint','AI tạo nội dung slide; có thể chỉnh sửa từng slide trước khi xuất .pptx.')+`<div class="grid2"><div class="card"><div class="field"><label>Bài học</label><select id="lesson">${options()}</select></div><div class="row"><div class="field"><label>Số slide</label><input id="count" type="number" min="5" max="30" value="12"></div><div class="field"><label>Phong cách</label><select id="style"><option>Hiện đại, rõ ràng</option><option>Trực quan, nhiều hoạt động</option><option>Tối giản, học thuật</option><option>Thân thiện với học sinh</option></select></div></div>${sourcePicker()}<div class="field"><label>Yêu cầu riêng</label><textarea id="request" placeholder="Ví dụ: có trò chơi, câu hỏi tương tác, đáp án ẩn..."></textarea></div><button class="btn" id="genSlides">✦ Tạo PowerPoint bằng AI</button></div><div class="card preview"><div id="result"><div class="empty">Bộ slide sẽ xuất hiện ở đây.</div></div></div></div>`}
function library(){return shell('Kho bài học','Danh mục metadata Toán 9 Kết nối tri thức làm dữ liệu nền cho AI.')+`<div class="card"><div class="lesson-list">${S.lessons.map(x=>`<div class="lesson"><small>${esc(x.chapter||'')} · ${esc(x.term||'')}</small><strong>${esc(x.title)}</strong><div class="hint">${esc((x.keywords||[]).join(', '))}</div></div>`).join('')}</div></div>`}
function sources(){return shell('Kho nguồn SGK','Nạp PDF/DOCX/TXT/MD và gắn nguồn vào bài để AI ưu tiên nội dung đó.')+`<div class="grid2"><div class="card"><div class="field"><label>Bài gắn nguồn</label><select id="sourceLesson"><option value="">Nguồn chung</option>${options()}</select></div><div class="field"><label>File</label><input id="sourceFile" type="file" accept=".pdf,.docx,.txt,.md"></div><button class="btn" id="uploadSource">Nạp vào kho</button><p class="hint">Tối đa 25 MB. Nội dung được trích xuất và lưu trong data/sources.json.</p></div><div class="card"><div class="source-list">${S.sources.length?S.sources.map(x=>`<div class="source"><b>${esc(x.name)}</b><small>${x.lessonId?esc(S.lessons.find(l=>l.id===x.lessonId)?.title||x.lessonId):'Nguồn chung'} · ${x.chars} ký tự</small><button class="btn danger" data-del-source="${x.id}" style="margin-top:8px">Xóa</button></div>`).join(''):'<div class="empty">Chưa có nguồn.</div>'}</div></div></div>`}
function products(){return shell('Sản phẩm của tôi','Mở lại, chỉnh sửa, lưu và xuất các sản phẩm đã tạo.')+`<div class="card">${S.projects.length?S.projects.map(p=>`<div class="project"><div><span class="tag">${p.type==='plan'?'KẾ HOẠCH':'SLIDE'}</span><strong>${esc(p.name)}</strong><div class="hint">${new Date(p.updatedAt||p.createdAt).toLocaleString('vi-VN')}</div></div><div class="toolbar"><button class="btn secondary" data-view="${p.id}">Mở</button><button class="btn danger" data-delete="${p.id}">Xóa</button></div></div>`).join(''):'<div class="empty">Chưa có sản phẩm.</div>'}</div>`}
function bind(){document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{S.page=b.dataset.page;S.editing=false;render()});document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{S.page=b.dataset.go;render()});if($('#lesson')){$('#lesson').onchange=loadSavedSources;loadSavedSources()}if($('#genPlan'))$('#genPlan').onclick=genPlan;if($('#genSlides'))$('#genSlides').onclick=genSlides;if($('#uploadSource'))$('#uploadSource').onclick=uploadSource;document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{if(confirm('Xóa sản phẩm?')){await api('/api/projects/'+b.dataset.delete,{method:'DELETE'});S.projects=(await api('/api/projects')).projects;render()}});document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>openProject(S.projects.find(p=>p.id===b.dataset.view)));document.querySelectorAll('[data-del-source]').forEach(b=>b.onclick=async()=>{await api('/api/sources/'+b.dataset.delSource,{method:'DELETE'});S.sources=(await api('/api/sources')).sources;render()})}
async function loadSavedSources(){if(!$('#savedSources'))return;const arr=(await api('/api/sources?lessonId='+encodeURIComponent($('#lesson').value))).sources;$('#savedSources').innerHTML=arr.length?arr.map(x=>`<div class="source"><b>${esc(x.name)}</b><small>${x.chars} ký tự</small></div>`).join(''):'<span class="hint">Chưa có nguồn lưu cho bài này.</span>'}
async function uploadSource(){try{const f=$('#sourceFile').files[0];if(!f)return alert('Chọn file trước.');const fd=new FormData();fd.append('file',f);fd.append('lessonId',$('#sourceLesson').value);await api('/api/sources',{method:'POST',body:fd});S.sources=(await api('/api/sources')).sources;alert('Đã nạp nguồn vào kho.');render()}catch(e){alert(e.message)}}
const loading=()=>'<div class="loading">AI đang xử lý... Nếu nguồn dài, có thể mất một lúc.</div>';
async function genPlan(){const r=$('#result');r.innerHTML=loading();try{const d=await api('/api/generate-plan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({lessonId:$('#lesson').value,duration:$('#duration').value,method:$('#method').value,request:$('#request').value,source:$('#source').value})});S.last=d.project;S.projects.unshift(d.project);S.editing=false;renderPlan(d.project)}catch(e){r.innerHTML='<div class="error">'+esc(e.message)+'</div>'}}
function listView(items){return (items||[]).map(x=>`<li>${esc(x)}</li>`).join('')||'<li>Chưa có nội dung.</li>'}
function listEdit(items,path){return (items||[]).map((x,i)=>`<li><textarea class="edit-field" data-list="${path}" data-index="${i}">${esc(x)}</textarea></li>`).join('')||'<li><textarea class="edit-field" data-list="'+path+'" data-index="0"></textarea></li>'}
function planPaper(p,editing=false){const d=p.data||{};return `<div class="preview-toolbar"><div><b>📄 Bản xem trước A4</b> <span class="source-badge">${editing?'Chế độ chỉnh sửa':'Chế độ xem'}</span></div><div class="toolbar" style="margin:0"><div class="view-actions"><button class="btn secondary" id="editPlan">✏️ Chỉnh sửa</button></div><div class="edit-actions"><button class="btn secondary" id="cancelEdit">↩ Hủy</button><button class="btn" id="savePlan">💾 Lưu chỉnh sửa</button></div><button class="btn green" id="exportDocx">📄 Xuất Word</button></div></div><div class="preview-scroll"><div class="a4-paper ${editing?'edit-mode':'view-only'}">
<div class="a4-header"><textarea class="a4-title edit-field" data-field="title">${esc(d.title||'KẾ HOẠCH BÀI DẠY')}</textarea><div class="a4-title view-field">${esc(d.title||'KẾ HOẠCH BÀI DẠY')}</div><div class="a4-meta">Môn: <b>${esc(d.subject||'Toán')}</b> &nbsp;|&nbsp; Lớp: <b>${esc(d.grade||'9')}</b> &nbsp;|&nbsp; Thời lượng: <b>${esc(d.duration||'')}</b> phút</div></div>
<div class="check">Bản nháp AI. Hãy kiểm tra nội dung chuyên môn, yêu cầu nhà trường và thời lượng trước khi sử dụng.</div>
<div class="a4-section">I. MỤC TIÊU</div><ol class="a4-list">${editing?listEdit(d.objectives,'objectives'):listView(d.objectives)}</ol>
<div class="a4-section">II. NĂNG LỰC VÀ PHẨM CHẤT</div><div class="a4-subsection">1. Năng lực</div><ol class="a4-list">${editing?listEdit(d.competencies,'competencies'):listView(d.competencies)}</ol><div class="a4-subsection">2. Phẩm chất</div><ol class="a4-list">${editing?listEdit(d.qualities,'qualities'):listView(d.qualities)}</ol>
<div class="a4-section">III. CHUẨN BỊ</div><div class="a4-subsection">1. Giáo viên</div><ol class="a4-list">${editing?listEdit(d.preparation?.teacher,'preparation.teacher'):listView(d.preparation?.teacher)}</ol><div class="a4-subsection">2. Học sinh</div><ol class="a4-list">${editing?listEdit(d.preparation?.students,'preparation.students'):listView(d.preparation?.students)}</ol>
<div class="a4-section">IV. TIẾN TRÌNH DẠY HỌC</div><table class="activity-table"><thead><tr><th>Giai đoạn</th><th>Thời gian</th><th>Hoạt động GV</th><th>Hoạt động HS</th><th>Sản phẩm / Đánh giá</th></tr></thead><tbody>${(d.activities||[]).map((a,i)=>`<tr><td>${editing?`<textarea class="edit-field" data-act="${i}" data-key="phase">${esc(a.phase||'')}</textarea>`:esc(a.phase||'')}</td><td>${editing?`<textarea class="edit-field" data-act="${i}" data-key="time">${esc(a.time||'')}</textarea>`:esc(a.time||'')}</td><td>${editing?`<textarea class="edit-field" data-act="${i}" data-key="teacher">${esc(a.teacher||'')}</textarea>`:esc(a.teacher||'')}</td><td>${editing?`<textarea class="edit-field" data-act="${i}" data-key="students">${esc(a.students||'')}</textarea>`:esc(a.students||'')}</td><td>${editing?`<textarea class="edit-field" data-act="${i}" data-key="product">${esc(a.product||'')}</textarea><textarea class="edit-field" data-act="${i}" data-key="assessment">${esc(a.assessment||'')}</textarea>`:`${esc(a.product||'')}${a.assessment?'<br><br><b>Đánh giá:</b> '+esc(a.assessment):''}`}</td></tr>`).join('')}</tbody></table>
<div class="a4-section">V. KIẾN THỨC CẦN GHI NHỚ</div><ol class="a4-list">${editing?listEdit(d.knowledgeSummary,'knowledgeSummary'):listView(d.knowledgeSummary)}</ol>
<div class="a4-section">VI. PHÂN HÓA</div><div class="a4-subsection">Hỗ trợ</div><ol class="a4-list">${editing?listEdit(d.differentiation?.support,'differentiation.support'):listView(d.differentiation?.support)}</ol><div class="a4-subsection">Mở rộng</div><ol class="a4-list">${editing?listEdit(d.differentiation?.extension,'differentiation.extension'):listView(d.differentiation?.extension)}</ol>
<div class="a4-section">VII. DẶN DÒ</div><ol class="a4-list">${editing?listEdit(d.homework,'homework'):listView(d.homework)}</ol>
${(d.notes||[]).length?`<div class="a4-section">VIII. GHI CHÚ</div><ol class="a4-list">${editing?listEdit(d.notes,'notes'):listView(d.notes)}</ol>`:''}<div class="a4-note">EduMath 9 AI · Bản xem trước được trình bày theo bố cục A4. File Word xuất ra được tạo riêng ở backend.</div></div></div>`}
function renderPlan(p){S.last=p;$('#result').innerHTML=planPaper(p,S.editing);bindPlanPreview(p)}
function bindPlanPreview(p){$('#editPlan')?.addEventListener('click',()=>{S.editing=true;renderPlan(p)});$('#cancelEdit')?.addEventListener('click',()=>{S.editing=false;renderPlan(p)});$('#savePlan')?.addEventListener('click',()=>savePlan(p));$('#exportDocx')?.addEventListener('click',()=>download('/api/export/docx',p,'ke-hoach-bai-day.docx'))}
function getByPath(obj,path){return path.split('.').reduce((a,k)=>a?.[k],obj)}
function setByPath(obj,path,val){const parts=path.split('.');let cur=obj;for(let i=0;i<parts.length-1;i++){if(!cur[parts[i]])cur[parts[i]]={};cur=cur[parts[i]]}cur[parts.at(-1)]=val}
function saveListFields(d){document.querySelectorAll('[data-list]').forEach(e=>{const path=e.dataset.list;let arr=getByPath(d,path);if(!Array.isArray(arr)){arr=[];setByPath(d,path,arr)}arr[+e.dataset.index]=e.value.trim()})}
async function savePlan(p){try{const d=clone(p.data);const title=$('[data-field="title"]');if(title)d.title=title.value.trim()||d.title;saveListFields(d);document.querySelectorAll('[data-act]').forEach(e=>{d.activities[+e.dataset.act][e.dataset.key]=e.value.trim()});const x=await api('/api/projects/'+p.id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({data:d})});p.data=x.project.data;p.name=p.data.title;S.projects=(await api('/api/projects')).projects;S.editing=false;renderPlan(p);alert('Đã lưu chỉnh sửa.')}catch(e){alert(e.message)}}
async function genSlides(){const r=$('#result');r.innerHTML=loading();try{const d=await api('/api/generate-slides',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({lessonId:$('#lesson').value,count:$('#count').value,style:$('#style').value,request:$('#request').value,source:$('#source').value})});S.last=d.project;S.projects.unshift(d.project);renderSlides(d.project)}catch(e){r.innerHTML='<div class="error">'+esc(e.message)+'</div>'}}
function renderSlides(p){const d=p.data;$('#result').innerHTML=`<div class="toolbar" style="justify-content:flex-end"><button class="btn" id="saveSlides">💾 Lưu chỉnh sửa</button><button class="btn green" id="exportPptx">📊 Xuất PowerPoint</button></div><div class="editor"><div class="field"><label>Tiêu đề</label><input id="slideTitle" value="${esc(d.title)}"></div><div class="slide-preview">${(d.slides||[]).map((s,i)=>`<div class="slide-page"><div class="tag">SLIDE ${i+1}</div><h2>${esc(s.title)}</h2><ul>${(s.bullets||[]).map((b,j)=>`<li><input data-st="${i}" data-s="${j}" value="${esc(b)}" style="width:100%;border:1px solid #dbe3ee;border-radius:7px;padding:8px;background:#fff"></li>`).join('')}</ul><textarea data-sn="${i}" class="notes" placeholder="Ghi chú giáo viên">${esc(s.speakerNotes||'')}</textarea></div>`).join('')}</div></div>`;$('#saveSlides').onclick=()=>saveSlides(p);$('#exportPptx').onclick=()=>download('/api/export/pptx',p,'bai-giang.pptx')}
async function saveSlides(p){const d=clone(p.data);d.title=$('#slideTitle').value;document.querySelectorAll('[data-st]').forEach(e=>{d.slides[+e.dataset.st].bullets[+e.dataset.s]=e.value});document.querySelectorAll('[data-sn]').forEach(e=>d.slides[+e.dataset.sn].speakerNotes=e.value);await api('/api/projects/'+p.id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({data:d})});p.data=d;p.name=d.title;S.projects=(await api('/api/projects')).projects;alert('Đã lưu.')}
async function download(url,p,name){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({project:p})});if(!r.ok){const e=await r.json().catch(()=>({}));return alert(e.error||'Xuất file thất bại')}const b=await r.blob(),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function openProject(p){S.page=p.type==='plan'?'plan':'slides';S.last=p;S.editing=false;render();setTimeout(()=>p.type==='plan'?renderPlan(p):renderSlides(p),0)}
init();
</script>
</body>
